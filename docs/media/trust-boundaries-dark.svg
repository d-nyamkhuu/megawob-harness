<line x1="325" y1="352" x2="260" y2="238" stroke="#9198a1" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
<text x="300.5" y="289.0" font-size="12" fill="#9198a1">screenshots</text>
</svg>
