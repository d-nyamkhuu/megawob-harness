<text x="180.0" y="209.0" text-anchor="middle" font-size="14" font-weight="600" fill="#e6edf3">site files</text>
<text x="180.0" y="227.0" text-anchor="middle" font-size="12" fill="#9198a1">html/sites/design-…/</text>
