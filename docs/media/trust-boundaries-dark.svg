<text x="680.0" y="99.0" text-anchor="middle" font-size="14" font-weight="600" fill="#e6edf3">render()</text>
<text x="680.0" y="117.0" text-anchor="middle" font-size="12" fill="#9198a1">headless Chromium, design image beside the page</text>
<rect x="530" y="164" width="300" height="56" rx="8" fill="#161b22" stroke="#6e7681"/>
<text x="680.0" y="189.0" text-anchor="middle" font-size="14" font-weight="600" fill="#e6edf3">check()</text>
<text x="680.0" y="207.0" text-anchor="middle" font-size="12" fill="#9198a1">lint + oracle at 3 viewports</text>
<rect x="50" y="352" width="170" height="56" rx="8" fill="#161b22" stroke="#6e7681"/>
<text x="135.0" y="377.0" text-anchor="middle" font-size="14" font-weight="600" fill="#e6edf3">Full gate</text>
<text x="135.0" y="395.0" text-anchor="middle" font-size="12" fill="#9198a1">5 viewports, more seeds</text>
<rect x="240" y="352" width="170" height="56" rx="8" fill="#161b22" stroke="#6e7681"/>
<text x="325.0" y="377.0" text-anchor="middle" font-size="14" font-weight="600" fill="#e6edf3">Reviewer</text>
<text x="325.0" y="395.0" text-anchor="middle" font-size="12" fill="#9198a1">no tools, other model</text>
<rect x="450" y="352" width="180" height="56" rx="8" fill="#161b22" stroke="#6e7681"/>
<text x="540.0" y="377.0" text-anchor="middle" font-size="14" font-weight="600" fill="#e6edf3">Fix rounds</text>
<text x="540.0" y="395.0" text-anchor="middle" font-size="12" fill="#9198a1">failures to a stronger model</text>
<rect x="650" y="352" width="190" height="56" rx="8" fill="#161b22" stroke="#6e7681"/>
<text x="745.0" y="377.0" text-anchor="middle" font-size="14" font-weight="600" fill="#e6edf3">Run record</text>
<text x="745.0" y="395.0" text-anchor="middle" font-size="12" fill="#9198a1">every turn, gate, review</text>
