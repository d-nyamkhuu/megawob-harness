<text x="180.0" y="110.0" text-anchor="middle" font-size="14" font-weight="600" fill="#e6edf3">Coding agent</text>
<text x="180.0" y="128.0" text-anchor="middle" font-size="12" fill="#9198a1">Codex or Claude</text>
