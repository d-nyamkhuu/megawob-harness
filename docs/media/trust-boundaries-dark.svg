<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 450" width="880" height="450" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9198a1"/></marker></defs>
<rect x="20" y="20" width="380" height="250" rx="12" fill="#2d1b0e" stroke="#bd561d" stroke-width="1.5"/>
<text x="36" y="46" font-size="15" font-weight="600" fill="#e6edf3">Agent sandbox<tspan font-weight="400" fill="#9198a1">  ·  writes only the site folder</tspan></text>
<rect x="480" y="20" width="380" height="250" rx="12" fill="#0c2d4a" stroke="#1f6feb" stroke-width="1.5"/>
<text x="496" y="46" font-size="15" font-weight="600" fill="#e6edf3">Tools server<tspan font-weight="400" fill="#9198a1">  ·  outside the sandbox (MCP)</tspan></text>
