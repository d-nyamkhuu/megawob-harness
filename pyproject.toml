[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "megawob-harness"
version = "0.2.0"
description = "Coding agents (Codex or Claude) that build MegaWoB design-* sites from design images: the checker decides, a reviewer scores, and a Stop hook makes the agent check its own work before it may finish"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{name = "Nyamkhuu Demberelsuren"}]
# MegaWoB itself is not a dependency: builds write sites into a megawob checkout, so install yours with
# `pip install -e path/to/megawob[check]` (README).
dependencies = ["jsonschema>=4", "mcp>=2.3,<3", "openai-codex>=0.167", "claude-agent-sdk>=0.2.181", "pillow"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff==0.17.2"]

[project.scripts]
megawob-harness = "megawob_harness.cli:main"

[tool.setuptools.packages.find]
include = ["megawob_harness*"]

[tool.setuptools.package-data]
megawob_harness = ["*.json", "cards/*.json", "prompts/*"]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["megawob"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["B027"]  # optional no-op hooks on the ABCs are deliberate

[tool.ruff.lint.isort]
known-third-party = ["megawob"]  # CI checks megawob out inside this folder; it is still a separate package

[tool.ruff.lint.per-file-ignores]
"megawob_harness/render.py" = ["E501"]  # the page-side JavaScript it evaluates

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["megawob: builds a real site in the megawob checkout (needs Node and Chromium; about a minute each)"]
